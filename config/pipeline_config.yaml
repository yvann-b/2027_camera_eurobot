# =============================================================================
# pipeline_config.yaml
#
# Configuration générale du pipeline (hors config détaillée du bus ZMQ,
# voir external_bus/robot_bus_config.py).
#
# Seule source de vérité pour les paramètres "infra" à modifier rapidement
# sans toucher au code : tailles de buffers, format image, mode standalone,
# contrainte mémoire, etc.
#
# Chargé par config/loader.py -> PipelineConfig (dataclass typée et validée).
# =============================================================================

version: 1

# -----------------------------------------------------------------------------
# Comportement général du pipeline
# -----------------------------------------------------------------------------
runtime:
  standalone: true          # true = le pipeline tourne sans connexion au robot
  target_fps: 30
  log_level: "INFO"         # DEBUG | INFO | WARNING | ERROR | CRITICAL
  yellow_robot_height : 430 # mm, on peut demander à ajouter une balise pour surélever le tag p_aruco. Il faut donc savoir la hauteur du tag des 2 robots
  blue_robot_height : 430   # mm, on peut demander à ajouter une balise pour surélever le tag p_aruco. Il faut donc savoir la hauteur du tag des 2 robots


# -----------------------------------------------------------------------------
# Caméra / format de la frame brute
# -----------------------------------------------------------------------------
camera:
  width: 2448
  height: 2048
  channels: 3
  dtype: "uint8"            # uint8 | uint16 | float32 | float64
  color_order: "BGR"        # BGR (défaut OpenCV) | RGB
  device_id: 0
  video_name_simulation : "records/demo_eurobot_presentation.avi"
  is_camera_used : false

# -----------------------------------------------------------------------------
# Calibration
# -----------------------------------------------------------------------------
calibration :
    number_frame : 100
    number_try_to_calib : 200
    calibration_distorsion_file : "config/parametres_calibration.npz"
    output_path : "tempo_file"


# -----------------------------------------------------------------------------
# Ring buffers — un seul buffer physique par flux (cf core/ring_buffer.py),
# plusieurs patterns de lecture possibles dessus (LIFO analyse / FIFO
# enregistrement).
#
# Layout d'un slot = [header][payload]
#   header  : frame_id + timestamp_ns, layout partagé par tous les buffers
#             (voir convention non négociable de propagation frame_id/ts)
#   payload : données spécifiques au flux
# -----------------------------------------------------------------------------
ring_buffer:
  header:
    frame_id_dtype: "int64"      # 8 octets
    timestamp_dtype: "int64"     # 8 octets (timestamp_ns)

  streams:
    camera:
      n_slots: 8
      shm_name: "rb_camera"
      payload_bytes: null        # null => déduit de camera.width*height*channels*dtype

    frame_redresse:
      n_slots: 8
      shm_name: "rb_redressee"
      payload_bytes: null        # null => déduit de camera.width*height*channels*dtype


    kf_output:
      n_slots: 16
      shm_name: "rb_kf_output"
      payload_bytes: 128

    zone_state:
      n_slots: 16
      shm_name: "rb_zone_state"
      payload_bytes: 18         # A adapter au nombre de zonee stockée (18), et donc 1 octet par zone (parce que numpy stocke des valeurs binaires sur 1 octet).

# -----------------------------------------------------------------------------
# Contrainte mémoire cible (machine cible basse, pas la machine de dev 32 Go)
# -----------------------------------------------------------------------------
memory:
  max_ram_gb: 16
  warn_threshold_ratio: 0.8   # warning si les ring buffers seuls dépassent 80% du budget

# -----------------------------------------------------------------------------
# Chemins
# -----------------------------------------------------------------------------
paths:
  models_dir: "models/"
  logs_dir: "logs/"

# -----------------------------------------------------------------------------
# Bus robot externe (tcp://) — juste l'interrupteur ici.
# Le détail (adresses, topics, timeouts...) vit dans
# external_bus/robot_bus_config.py, activable/désactivable via ce flag.
# -----------------------------------------------------------------------------
external_bus:
  enabled: True
  ROBOT_BUS_IP : "127.0.0.1"     # 192.168.2.6 (TIC) / 192.168.2.8 (TAC) en prod
  # 127.0.0.1 pour tester avec simulate_robot_receiver.py en local
  ROBOT_BUS_PORT : 5570
  ROBOT_BUS_TOPIC : "camera.status"
  ROBOT_BUS_SNDHWM : 5           # ne garder que les N derniers messages non consommés (pas de queue qui grossit)
  ROBOT_BUS_LINGER_MS : 0        # ne jamais bloquer à la fermeture du socket



