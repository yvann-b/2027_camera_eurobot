# -----------------------------------------------------------------------------
# Définition table homographie
# -----------------------------------------------------------------------------
table :
  width : 3000                  # mm
  height : 2000                 # mm
  security_margin : 100         # mm
  ratio_mm_per_pixel : 2        # La distance entre 2 pixel = 2 mm (donc la table "pixel" = 1500x1000 (en négligeant la security margin))



# -----------------------------------------------------------------------------
