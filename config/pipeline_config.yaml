# -----------------------------------------------------------------------------
# YOLO config
# -----------------------------------------------------------------------------
YOLO:
  models: "models/260219_homographieV1.pt"
  confiance : 0.7
  target_class : ["blue", "yellow", "slice","tower","black"]
  object_height : 10


# -----------------------------------------------------------------------------
# Kalman config
# -----------------------------------------------------------------------------
Kalman :
  initial_confidence :
    - [ 50, 0.0, 0.0 ]
    - [ 0.0, 50.0, 0.0 ]
    - [ 0.0, 0.0, 50.0 ]
  covariance_model :
    - [ 0.5, 0.0, 0.0 ]
    - [ 0.0, 0.5, 0.0 ]
    - [ 0.0, 0.0, 0.5 ]
  covariance_mesurement:
    - [ 50, 0.0, 0.0 ]
    - [ 0.0, 50.0, 0.0 ]
    - [ 0.0, 0.0, 50.0 ]
  threshold_nohits : 10
  threshold_fusion : 3
  distance : 10

